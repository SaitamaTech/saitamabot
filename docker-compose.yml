services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saitama_bot
      POSTGRES_USER: saitama
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saitama}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saitama-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saitama -d saitama_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  saitama-postgres:
